name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: senso
          MYSQL_PASSWORD: senso_ci
          MYSQL_DATABASE: senso_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://senso:senso_ci@127.0.0.1:3306/senso_test
      E2E_DATABASE_URL: mysql://senso:senso_ci@127.0.0.1:3306/senso_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crear BD E2E
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE senso_e2e_test; GRANT ALL ON senso_e2e_test.* TO 'senso'@'%';"
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build && node scripts/verify-pwa.mjs
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: ""
